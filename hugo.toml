baseURL = "https://uncat2310.github.io/Github_Note/"
languageCode = "zh-CN"
title = "uncat's Tech Notes"

theme = "PaperMod"

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[params]
  homeInfoParams = { Title = "uncat's 技术笔记", Content = "AI 编程工具 · 环境配置 · 部署运维 · 实用脚本" }
  socialIcons = [
    { name = "github", url = "https://github.com/uncat2310/Github_Note" }
  ]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButton = false

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/"
  weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
